apiVersion: "v1"
protocol: "ssh"
address: ":2222"
description: "SSH interactive ChatGPT"
commands:
  - regex: "^(.+)$"
    plugin: "LLMHoneypot"
serverVersion: "OpenSSH"
serverName: "ubuntu"
# The bait of the decoy: the credential it offers in the generated
# /etc/shadow. Using it here is logged as a successful login.
passwordRegex: "^(root|qwerty|Smoker666|123456|jenkins|minecraft|sinus|alex|postgres|Ly123456|1234|Bkp!2023#svc)$"
deadlineTimeoutSeconds: 6000
plugin:
  llmProvider: "openai"
  llmModel: "gpt-4o"
  openAISecretKey: "sk-proj-1234"
  rateLimitEnabled: true
  rateLimitRequests: 10
  rateLimitWindowSeconds: 60
